site_name: twat-image Documentation
site_description: Image processing utilities for the twat plugin ecosystem
site_url: https://github.com/twardoch/twat-image
repo_url: https://github.com/twardoch/twat-image
repo_name: twardoch/twat-image
edit_uri: edit/main/src_docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/twardoch/twat-image

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Image Operations: user-guide/operations.md
    - Gray-to-Alpha: user-guide/gray2alpha.md
    - CLI Reference: user-guide/cli-reference.md
    - AI Boundary: user-guide/ai-boundary.md
  - Development:
    - API Reference: development/api-reference.md
    - Contributing: development/contributing.md
    - Style Guide: development/style-guide.md
  - About:
    - Changelog: about/changelog.md
    - License: about/license.md

docs_dir: src_docs
site_dir: docs
